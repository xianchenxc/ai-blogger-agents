<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=1080" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=Noto+Serif+SC:wght@500;700&family=Outfit:wght@400;600&display=swap"
      rel="stylesheet"
    />
    <title>__XHS_TITLE_ESC__</title>
    <style>
      __XHS_STYLES__
      /* Card 2 — 场景: rail + column (shared palette) */
      .card-scene main {
        flex-direction: row;
        align-items: stretch;
        gap: 0;
        padding-left: 56px;
        padding-right: 56px;
      }
      .card-scene .rail {
        width: 8px;
        border-radius: 999px;
        background: linear-gradient(
          180deg,
          var(--xhs-accent),
          var(--xhs-accent-2)
        );
        margin-right: 40px;
        flex-shrink: 0;
      }
      .card-scene .scene-inner {
        flex: 1;
        display: flex;
        flex-direction: column;
        gap: 28px;
        padding-top: 8px;
      }
      .card-scene .scene-h {
        margin: 0;
        font-family: Outfit, system-ui, sans-serif;
        font-size: 22px;
        letter-spacing: 0.2em;
        text-transform: uppercase;
        color: var(--xhs-text-muted);
      }
      .card-scene .md-rendered p {
        font-size: 34px;
        color: var(--xhs-text);
      }
      .card-scene .md-rendered p:last-child {
        font-family: Outfit, system-ui, sans-serif;
        font-size: 30px;
        color: var(--xhs-accent-soft);
        font-style: italic;
      }
    </style>
  </head>
  <body class="xhs-card card-scene">
    <main>
      <div class="rail" aria-hidden="true"></div>
      <div class="scene-inner">
        <h2 class="scene-h">__XHS_TITLE_ESC__</h2>
        <div class="md-rendered">__XHS_BODY_HTML__</div>
      </div>
    </main>
  </body>
</html>
