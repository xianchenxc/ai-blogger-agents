<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=1080" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=Noto+Serif+SC:wght@600;700&family=Outfit:wght@600;700&display=swap"
      rel="stylesheet"
    />
    <title>__XHS_TITLE_ESC__</title>
    <style>
      __XHS_STYLES__
      /* Card 6 — CTA: ribbon + closing line */
      .card-cta main {
        justify-content: flex-end;
        padding-bottom: 120px;
        gap: 32px;
      }
      .card-cta .ribbon {
        align-self: stretch;
        padding: 18px 28px;
        border-radius: 12px;
        background: var(--xhs-surface-dim);
        border: 1px solid var(--xhs-border-accent);
        font-family: Outfit, system-ui, sans-serif;
        font-size: 26px;
        letter-spacing: 0.08em;
        color: var(--xhs-accent-soft);
        text-align: center;
      }
      .card-cta .md-rendered {
        font-size: 40px;
        font-weight: 700;
        color: var(--xhs-text-bright);
        text-align: center;
      }
      .card-cta .md-rendered p {
        margin: 0;
      }
      .card-cta .md-rendered a {
        color: var(--xhs-link);
      }
    </style>
  </head>
  <body class="xhs-card card-cta">
    <main>
      <div class="ribbon">__XHS_TITLE_ESC__</div>
      <div class="md-rendered">__XHS_BODY_HTML__</div>
    </main>
  </body>
</html>
