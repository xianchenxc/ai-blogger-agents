<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=1080" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=Noto+Serif+SC:wght@500;700&family=Outfit:wght@500;600&display=swap"
      rel="stylesheet"
    />
    <title>__XHS_TITLE_ESC__</title>
    <style>
      __XHS_STYLES__
      /* Card 4 — 知识点: list as stacked surfaces */
      .card-tips main {
        gap: 24px;
      }
      .card-tips .tips-h {
        margin: 0;
        font-family: Outfit, system-ui, sans-serif;
        font-size: 24px;
        color: var(--xhs-kicker);
        letter-spacing: 0.14em;
        text-transform: uppercase;
      }
      .card-tips .md-rendered ul {
        list-style: none;
        margin: 0;
        padding: 0;
        display: flex;
        flex-direction: column;
        gap: 18px;
      }
      .card-tips .md-rendered li {
        margin: 0;
        padding: 22px 26px;
        border-radius: 16px;
        background: var(--xhs-surface-dim);
        border: 1px solid var(--xhs-border-accent);
        font-size: 32px;
        line-height: 1.45;
        color: var(--xhs-text);
        box-shadow: 0 8px 32px var(--xhs-shadow);
      }
      .card-tips .md-rendered li strong {
        color: var(--xhs-text-bright);
      }
    </style>
  </head>
  <body class="xhs-card card-tips">
    <main>
      <h2 class="tips-h">__XHS_TITLE_ESC__</h2>
      <div class="md-rendered">__XHS_BODY_HTML__</div>
    </main>
  </body>
</html>
